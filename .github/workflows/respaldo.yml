# Respaldo diario de la base de QSecha (Supabase) en Firebase Storage.
# Corre todas las noches (03:15 hora de Chile en verano) y también a mano desde
# GitHub > Actions > "Respaldo base de datos" > Run workflow.
# Configuración y restauración: docs/RESPALDO.md
name: Respaldo base de datos

on:
  schedule:
    - cron: '15 6 * * *'
  workflow_dispatch:

concurrency: respaldo

jobs:
  respaldo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      BUCKET: ${{ secrets.FIREBASE_BUCKET }}
    steps:
      - name: Revisar configuración
        id: config
        run: |
          faltan=""
          [ -z "$SUPABASE_DB_URL" ] && faltan="$faltan SUPABASE_DB_URL"
          [ -z "$BUCKET" ] && faltan="$faltan FIREBASE_BUCKET"
          [ -z "${{ secrets.FIREBASE_SA_KEY }}" ] && faltan="$faltan FIREBASE_SA_KEY"
          if [ -n "$faltan" ]; then
            # Mientras no esté configurado, no falla (evita correos diarios); solo deja el aviso
            echo "::warning::Respaldo no configurado todavía. Faltan secretos en GitHub:$faltan (ver docs/RESPALDO.md)"
            echo "listo=no" >> "$GITHUB_OUTPUT"
          else
            echo "listo=si" >> "$GITHUB_OUTPUT"
          fi

      - name: Validar conexión de Supabase
        if: steps.config.outputs.listo == 'si'
        run: |
          # Limpia espacios, saltos de línea y comillas que suelen colarse al pegar
          URL=$(printf '%s' "$SUPABASE_DB_URL" | tr -d '\r\n' | sed -e 's/^[[:space:]"'"'"']*//' -e 's/[[:space:]"'"'"']*$//')
          echo "::add-mask::$URL"
          esquema=$(printf '%s' "$URL" | cut -c1-13)
          host=$(printf '%s' "$URL" | sed -n 's#^[^@]*@\([^:/?]*\).*#\1#p')
          usuario=$(printf '%s' "$URL" | sed -n 's#^postgres[a-z]*://\([^:@]*\).*#\1#p')
          echo "Largo: ${#URL} caracteres · empieza con: ${esquema%%//*}// · usuario: ${usuario:-?} · servidor: ${host:-?}"
          case "$URL" in
            postgresql://*|postgres://*) ;;
            *) echo "::error::SUPABASE_DB_URL debe empezar con postgresql:// (copia la línea completa de Session pooler en Supabase > Connect)"; exit 1 ;;
          esac
          if printf '%s' "$URL" | grep -q 'YOUR-PASSWORD'; then echo "::error::SUPABASE_DB_URL todavía tiene [YOUR-PASSWORD]: reemplázalo por la clave de la base"; exit 1; fi
          case "$host" in *pooler.supabase.com) ;; *) echo "::warning::El servidor no es el Session pooler (*.pooler.supabase.com); desde GitHub puede no conectar" ;; esac
          echo "SUPABASE_DB_URL=$URL" >> "$GITHUB_ENV"

      - name: Instalar cliente PostgreSQL 17
        if: steps.config.outputs.listo == 'si'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Sacar copia de la base
        if: steps.config.outputs.listo == 'si'
        run: |
          set -euo pipefail
          FECHA=$(TZ=America/Santiago date +%F_%H%M)
          echo "FECHA=$FECHA" >> "$GITHUB_ENV"
          mkdir -p respaldo
          # 1) Todo lo de la app (tablas, vistas, funciones, triggers, políticas y datos)
          pg_dump "$SUPABASE_DB_URL" -Fc --no-owner --no-privileges -n public -f "respaldo/qsecha_$FECHA.dump"
          # 2) Usuarios de acceso (para que los perfiles calcen al restaurar)
          pg_dump "$SUPABASE_DB_URL" --data-only --no-owner -t auth.users -t auth.identities -f "respaldo/auth_usuarios_$FECHA.sql"
          gzip "respaldo/auth_usuarios_$FECHA.sql"
          # 3) Conteo de filas por tabla, para revisar de un vistazo
          psql "$SUPABASE_DB_URL" -At -F ';' -c "select relname, n_live_tup from pg_stat_user_tables where schemaname='public' order by relname" > "respaldo/conteo_$FECHA.csv"
          # Verificar que la copia se puede leer
          pg_restore --list "respaldo/qsecha_$FECHA.dump" > /dev/null
          ls -lh respaldo

      - name: Conectar con Firebase (Google Cloud)
        if: steps.config.outputs.listo == 'si'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SA_KEY }}

      - name: Instalar gcloud
        if: steps.config.outputs.listo == 'si'
        uses: google-github-actions/setup-gcloud@v2

      - name: Subir a Firebase Storage
        if: steps.config.outputs.listo == 'si'
        run: |
          set -euo pipefail
          gcloud storage cp respaldo/* "gs://$BUCKET/respaldos/$FECHA/"
          echo "Respaldo guardado en gs://$BUCKET/respaldos/$FECHA/" >> "$GITHUB_STEP_SUMMARY"
          cat respaldo/conteo_$FECHA.csv | sed 's/;/: /' >> "$GITHUB_STEP_SUMMARY"

      - name: Borrar respaldos de más de 60 días
        if: steps.config.outputs.listo == 'si'
        run: |
          cat > ciclo.json <<'JSON'
          { "rule": [ { "action": { "type": "Delete" }, "condition": { "age": 60, "matchesPrefix": ["respaldos/"] } } ] }
          JSON
          gcloud storage buckets update "gs://$BUCKET" --lifecycle-file=ciclo.json || echo "::warning::No se pudo fijar la limpieza automática (requiere rol Storage Admin)"
